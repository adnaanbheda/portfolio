<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Resource hints for external domains -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">

    <!-- Preload critical assets -->
    <link rel="preload" href="/jost.ttf" as="font" type="font/ttf" crossorigin>

    <!--
      The GLBs are only requested once the lazy Experience chunk has downloaded
      and evaluated, which is three round trips deep. Preloading them here starts
      the transfers alongside the JS instead of after it.

      crossorigin="anonymous" is required even though these are same-origin:
      three's FileLoader calls fetch() (mode "cors", credentials "same-origin"),
      and a preload only matches when it was made in that same mode. Without the
      attribute the preload is "no-cors"/"include", Chrome reports "preload ...
      is not used because the request credentials mode does not match", and
      every file is requested twice.
    -->
    <link rel="preload" href="/level.glb" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="/standing_desk.glb" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="/monitor.glb" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="/lamplight-transformed.glb" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="/snakeplant.glb" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="/speakers.glb" as="fetch" crossorigin="anonymous">

    <!-- Draco decoder, needed the moment the first compressed mesh is parsed -->
    <link rel="preload" href="/draco/draco_wasm_wrapper.js" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="/draco/draco_decoder.wasm" as="fetch" crossorigin="anonymous">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>Adnaan Bheda</title>
    <meta name="description" content="Adnaan Bheda's portfolio: an interactive 3D desk setup built with React Three Fiber.">
    <meta name="theme-color" content="#241a1a">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Adnaan Bheda">
    <meta property="og:description" content="An interactive 3D desk setup built with React Three Fiber.">
    <meta property="og:url" content="https://portfolio.adnaan.me">
    <meta name="twitter:card" content="summary">
</head>

<body>
    <div id="root"></div>
    <script type="module" src="./index.jsx"></script>
</body>

</html>
