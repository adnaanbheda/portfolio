server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # Vite emits a .gz next to every compressible asset, so serve those directly
    # rather than compressing on every request — the Pi does no work per hit and
    # the ratio is better than on-the-fly gzip.
    gzip_static  on;

    # Fallback for anything that was not precompressed at build time.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/ttf application/wasm model/gltf-binary;

    types {
        application/wasm     wasm;
        model/gltf-binary    glb;
        font/ttf             ttf;
        image/webp           webp;
    }

    # index.html must never be cached, or a deploy strands clients on the old
    # asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Everything under /assets/ carries a content hash in its filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Models, fonts, textures and the Draco decoder live at the root with stable
    # filenames, so they get a bounded TTL instead of an immutable one.
    location ~* \.(glb|ttf|woff2?|webp|png|jpe?g|svg|ico|wasm|pdf)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
